<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Sign up</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <form class="panel auth-card" id="form">
      <h1>Create account</h1>
      <label for="name">Full name</label>
      <input id="name" required maxlength="50" autocomplete="name">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters">
      <div class="form-error" id="error"></div>
      <button class="btn btn-block" type="submit">Sign up</button>
      <p>Already have an account? <a href="/login.html">Login</a></p>
    </form>
  </main>

  <footer>TaskFlow · CodeAlpha Full Stack Internship — Task 3</footer>

  <script src="/js/common.js"></script>
  <script>
    const next = new URLSearchParams(location.search).get('next');
    const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      try {
        Auth.save(await api('/auth/register', {
          method: 'POST',
          body: {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          },
        }));
        location.href = safeNext;
      } catch (err) {
        error.textContent = err.message;
      }
    });
  </script>
</body>
</html>
